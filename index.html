<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LinkVault | Firebase Edit Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* CSS Dasar */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #f8f9fc; --card-bg: #ffffff; --text-main: #1a1d23; --text-sub: #64748b;
  --accent: #6366f1; --accent-soft: #eef2ff; --border: #e2e8f0; --danger: #ef4444;
  --r-lg: 16px; --r-md: 12px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  --font: 'Plus Jakarta Sans', sans-serif;
}
body{ font-family: var(--font); background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 0 1.5rem 5rem; }
.container{ max-width: 800px; margin: 0 auto; }
header{ display: flex; align-items: center; justify-content: space-between; padding: 3rem 0 2rem; }
.logo-text{ font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo-text span{ color: var(--accent); }
.btn-add{ background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: var(--r-md); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.search-wrap{ position: relative; margin-bottom: 2.5rem; }
.search-input{ width: 100%; padding: 14px 20px 14px 48px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-md); outline: none; }
.search-ico{ position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

/* Grid & Cards */
.grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
.link-card{ position: relative; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px 12px; text-decoration: none; display: flex; flex-direction: column; align-items: center; transition: 0.2s; box-shadow: var(--shadow); }
.link-card:hover{ transform: translateY(-4px); border-color: var(--accent); }
.icon-box{ width: 56px; height: 56px; background: var(--accent-soft); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; overflow: hidden; }
.icon-box img { width: 100%; height: 100%; object-fit: cover; }
.card-name{ font-weight: 700; font-size: 14px; color: var(--text-main); text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-domain{ font-size: 11px; color: var(--text-sub); margin-top: 4px; }

/* Action Buttons on Card */
.action-btns { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: 0.2s; z-index: 5; }
.link-card:hover .action-btns { opacity: 1; }
.mini-btn { width: 24px; height: 24px; background: #fff; border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; }
.mini-btn.del:hover { color: var(--danger); border-color: var(--danger); }
.mini-btn.edit:hover { color: var(--accent); border-color: var(--accent); }

/* Modal & Tabs */
.overlay{ position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.2s; }
.overlay.open{ opacity: 1; pointer-events: all; }
.modal{ background: #fff; width: 90%; max-width: 440px; border-radius: 20px; padding: 2rem; max-height: 90vh; overflow-y: auto; }
.field{ margin-bottom: 1.2rem; }
.field label{ display: block; font-size: 11px; font-weight: 800; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; }
.field input{ width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
.tab-header { display: flex; gap: 5px; background: #f1f5f9; padding: 4px; border-radius: 10px; margin-bottom: 12px; }
.tab-btn { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-sub); }
.tab-btn.active { background: #fff; color: var(--accent); }
.icon-grid{ display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-height: 100px; overflow-y: auto; padding: 8px; background: #f8fafc; border-radius: 8px; border: 1px solid var(--border); }
.icon-opt{ aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; border-radius: 6px; }
.icon-opt.selected{ background: var(--accent-soft); border: 1.5px solid var(--accent); }
.photo-upload-box { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; }
.photo-preview-wrap { display: flex; align-items: center; gap: 15px; background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
.img-prev { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
.toast{ position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: #fff; padding: 10px 20px; border-radius: 40px; font-size: 13px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 1000; }
.toast.show{ opacity: 1; bottom: 30px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-text">Link<span>Vault.</span></div>
    <button class="btn-add" onclick="openModal()">
      <span>+</span> Tambah
    </button>
  </header>

  <div class="search-wrap">
    <input type="text" class="search-input" id="search" placeholder="Cari koleksi Anda..." oninput="window.renderLinks()"/>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title" style="margin-bottom: 1.5rem; font-size: 18px;">Simpan Link Baru</h2>
    <input type="hidden" id="f-edit-key"> <div class="field">
      <label>Nama</label>
      <input type="text" id="f-name" placeholder="cth: Kerja">
    </div>
    <div class="field">
      <label>URL</label>
      <input type="text" id="f-url" placeholder="https://...">
    </div>
    <div class="field">
      <label>Visual</label>
      <div class="tab-header">
        <button class="tab-btn active" id="tab-emoji-btn" onclick="switchTab('emoji')">Emoji</button>
        <button class="tab-btn" id="tab-photo-btn" onclick="switchTab('photo')">Foto</button>
      </div>
      <div id="pane-emoji"><div class="icon-grid" id="icon-selector"></div></div>
      <div id="pane-photo" style="display:none;">
        <div class="photo-upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
          <p style="font-size: 12px; color: var(--text-sub);">Klik untuk upload</p>
          <input type="file" id="file-input" hidden accept="image/*" onchange="handleFile(this.files[0])">
        </div>
        <div id="photo-preview-area" style="display:none; margin-top:10px;">
            <div class="photo-preview-wrap">
                <img src="" id="preview-img" class="img-prev">
                <button onclick="removePhoto()" style="border:none; background:none; color:var(--danger); cursor:pointer;">Hapus</button>
            </div>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 2rem;">
      <button onclick="closeModal()" style="flex:1; padding: 12px; border: 1px solid var(--border); background:#fff; border-radius: 8px; cursor: pointer;">Batal</button>
      <button onclick="saveLink()" id="btn-save" style="flex:2; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, update, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // --- CONFIG FIREBASE ---
  const firebaseConfig = {
            apiKey: "AIzaSyATTNNn1r1ORYTFWdljzd4dessh8t33SbI",
            authDomain: "ppk-ormawa-42e49.firebaseapp.com",
            databaseURL: "https://ppk-ormawa-42e49-default-rtdb.firebaseio.com",
            projectId: "ppk-ormawa-42e49",
            storageBucket: "ppk-ormawa-42e49.firebasestorage.app",
            messagingSenderId: "629446223042",
            appId: "1:629446223042:web:092fe22b2bdb868ba2c75b"
        };


  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const linksRef = ref(db, 'links');

  window.links = [];
  const EMOJIS = ['🔗','🌐','💻','📱','🎨','🎮','🎬','🎵','📝','📚','🛍️','🔥','⚡','🚀','🛠️','📷','💼','❤️','🌈','💡'];
  let selectedIcon = EMOJIS[0];
  let uploadedPhoto = null;
  let currentTab = 'emoji';

  onValue(linksRef, (snapshot) => {
    const data = snapshot.val();
    window.links = data ? Object.keys(data).map(key => ({ ...data[key], fbKey: key })) : [];
    window.renderLinks();
  });

  window.renderLinks = () => {
    const grid = document.getElementById('grid');
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = window.links.filter(l => l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q));

    grid.innerHTML = '';
    filtered.reverse().forEach(l => {
      let domain = '';
      try { domain = new URL(l.url).hostname.replace('www.', ''); } catch(e) {}
      const card = document.createElement('a');
      card.className = 'link-card';
      card.href = l.url;
      card.target = '_blank';
      const visual = l.photo ? `<img src="${l.photo}">` : `<span>${l.icon || '🔗'}</span>`;
      card.innerHTML = `
        <div class="action-btns">
            <div class="mini-btn edit" onclick="window.editLink(event, '${l.fbKey}')">✎</div>
            <div class="mini-btn del" onclick="window.deleteLink(event, '${l.fbKey}')">✕</div>
        </div>
        <div class="icon-box">${visual}</div>
        <div class="card-name">${l.name}</div>
        <div class="card-domain">${domain}</div>
      `;
      grid.appendChild(card);
    });
  };

  window.saveLink = () => {
    const editKey = document.getElementById('f-edit-key').value;
    const name = document.getElementById('f-name').value.trim();
    const url = document.getElementById('f-url').value.trim();
    if(!url.startsWith('http')) return showToast('URL tidak valid');

    const linkData = {
      name: name || new URL(url).hostname,
      url: url,
      icon: currentTab === 'emoji' ? selectedIcon : null,
      photo: currentTab === 'photo' ? uploadedPhoto : null,
      updatedAt: Date.now()
    };

    if (editKey) {
      // MODE EDIT
      update(ref(db, `links/${editKey}`), linkData).then(() => {
        window.closeModal();
        showToast('Berhasil diperbarui!');
      });
    } else {
      // MODE TAMBAH
      const newRef = push(linksRef);
      set(newRef, { ...linkData, createdAt: Date.now() }).then(() => {
        window.closeModal();
        showToast('Berhasil disimpan!');
      });
    }
  };

  window.editLink = (e, key) => {
    e.preventDefault(); e.stopPropagation();
    const data = window.links.find(l => l.fbKey === key);
    if (!data) return;

    document.getElementById('modal-title').textContent = "Edit Link";
    document.getElementById('f-edit-key').value = key;
    document.getElementById('f-name').value = data.name;
    document.getElementById('f-url').value = data.url;
    
    if (data.photo) {
        window.switchTab('photo');
        uploadedPhoto = data.photo;
        document.getElementById('preview-img').src = data.photo;
        document.getElementById('photo-preview-area').style.display = 'block';
        document.getElementById('drop-zone').style.display = 'none';
    } else {
        window.switchTab('emoji');
        selectedIcon = data.icon || EMOJIS[0];
        initIcons();
    }
    
    document.getElementById('modal-overlay').classList.add('open');
  };

  window.deleteLink = (e, key) => {
    e.preventDefault(); e.stopPropagation();
    if(confirm('Hapus link ini?')) {
        remove(ref(db, `links/${key}`)).then(() => showToast('Dihapus'));
    }
  };

  window.openModal = () => {
    document.getElementById('modal-title').textContent = "Simpan Link Baru";
    document.getElementById('f-edit-key').value = "";
    document.getElementById('f-name').value = "";
    document.getElementById('f-url').value = "";
    selectedIcon = EMOJIS[0];
    initIcons();
    window.switchTab('emoji');
    window.removePhoto();
    document.getElementById('modal-overlay').classList.add('open');
  };

  window.closeModal = () => document.getElementById('modal-overlay').classList.remove('open');
  window.switchTab = (type) => {
    currentTab = type;
    document.getElementById('pane-emoji').style.display = type === 'emoji' ? 'block' : 'none';
    document.getElementById('pane-photo').style.display = type === 'photo' ? 'block' : 'none';
    document.getElementById('tab-emoji-btn').classList.toggle('active', type === 'emoji');
    document.getElementById('tab-photo-btn').classList.toggle('active', type === 'photo');
  };

  window.handleFile = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      uploadedPhoto = e.target.result;
      document.getElementById('preview-img').src = uploadedPhoto;
      document.getElementById('photo-preview-area').style.display = 'block';
      document.getElementById('drop-zone').style.display = 'none';
    };
    reader.readAsDataURL(file);
  };

  window.removePhoto = () => {
    uploadedPhoto = null;
    document.getElementById('photo-preview-area').style.display = 'none';
    document.getElementById('drop-zone').style.display = 'block';
  };

  function initIcons() {
    const container = document.getElementById('icon-selector');
    container.innerHTML = '';
    EMOJIS.forEach(emoji => {
      const div = document.createElement('div');
      div.className = `icon-opt ${emoji === selectedIcon ? 'selected' : ''}`;
      div.textContent = emoji;
      div.onclick = () => {
        document.querySelectorAll('.icon-opt').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        selectedIcon = emoji;
      };
      container.appendChild(div);
    });
  }
</script>

<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
